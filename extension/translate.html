<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LingoLeaf · 文本翻译</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="translate.css"></head><body>
<main class="translator enter">
  <header class="row between"><div class="brand"><img class="logo" src="icons/logo.svg" alt=""><div><div class="brand-name">LingoLeaf <span class="cn">轻译</span></div><div class="brand-sub">TEXT TRANSLATION</div></div></div><button id="settings" class="icon-button" title="连接与偏好设置" aria-label="连接与偏好设置"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 2 3-1 1-3 3-1 1-3-2-2V5l-3-1-2 1-2-2Z"/><circle cx="11" cy="10" r="3"/></svg></button></header>
  <nav class="mode-nav" aria-label="翻译入口"><a href="popup.html">网页翻译</a><a class="active" href="translate.html" aria-current="page">文本翻译</a><span class="connection-mini"><span class="dot"></span><span id="connection-label">待连接</span></span></nav>
  <section><div class="row between field-label"><label for="source">输入要翻译的内容</label><span><span id="count">0</span> / 6000</span></div><textarea id="source" maxlength="6000" placeholder="输入或粘贴文本，自动识别原文语言…" autofocus></textarea></section>
  <section class="translation-options"><label class="field-label" for="target">翻译为</label><select id="target" aria-label="目标语言"></select><div class="detail-label">输出方式</div><div class="detail-modes" role="group" aria-label="输出方式"><button type="button" data-mode="plain" aria-pressed="true"><b>仅译文</b><span>最快</span></button><button type="button" data-mode="annotated" aria-pressed="false"><b>译文＋简注</b><span>少量说明</span></button><button type="button" data-mode="detailed" aria-pressed="false"><b>深度讲解</b><span>例句与语法</span></button></div></section>
  <button id="run" class="primary run" disabled><span id="run-label">开始翻译</span><span aria-hidden="true">↗</span></button>
  <section class="result-card" aria-label="翻译结果"><div class="row between result-head"><span>翻译结果</span><div><button id="copy" class="text-button" disabled>复制</button><button id="clear" class="text-button">清空</button></div></div><div id="result" class="result empty" tabindex="0">结果将在这里显示</div></section>
  <div id="status" class="status" role="status">内容只会在翻译时发送至 DeepSeek，不保存历史。</div>
</main><script type="module" src="translate.js"></script></body></html>
