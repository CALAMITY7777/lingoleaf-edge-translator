<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LingoLeaf · 轻译</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"></head><body>
<main class="popup enter">
  <header class="row between"><div class="brand"><img class="logo" src="icons/logo.svg" alt=""><div><div class="brand-name">LingoLeaf <span class="cn">轻译</span></div><div class="brand-sub">A LITTLE CLOSER TO THE WORLD</div></div></div><button id="settings" class="icon-button" title="连接与偏好设置" aria-label="连接与偏好设置"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 2 3-1 1-3 3-1 1-3-2-2V5l-3-1-2 1-2-2Z"/><circle cx="11" cy="10" r="3"/></svg></button></header>
  <nav class="mode-nav" aria-label="翻译入口"><a class="active" href="popup.html" aria-current="page">网页翻译</a><a href="translate.html">文本翻译</a><span class="connection-mini"><span class="dot"></span><span id="connection-label">待连接</span></span></nav>
  <section class="translation-controls"><div class="row between section-title"><span>翻译为</span><span class="source-label">自动检测原文 <span>↗</span></span></div><div class="languages" id="languages" role="group" aria-label="翻译目标语言"></div></section>
  <section class="preferences"><div class="row between"><div class="row"><span class="preference-icon">▤</span><div><div class="pref-title">翻译范围</div><div class="pref-sub">整页或智能识别正文</div></div></div><div class="scope-control" role="group" aria-label="翻译范围"><button type="button" data-scope="page" aria-pressed="true">整页</button><button type="button" data-scope="article" aria-pressed="false" title="智能识别正文，跳过导航、侧栏和推荐">仅正文</button></div></div><div class="rule"></div><div class="row between"><div class="row"><span class="preference-icon">◫</span><div><div class="pref-title">网页显示</div><div class="pref-sub">译文精简显示，无文本框</div></div></div><div class="scope-control" role="group" aria-label="网页显示方式"><button type="button" data-display="bilingual" aria-pressed="true">对照</button><button type="button" data-display="replace" aria-pressed="false">替换</button></div></div><div class="rule"></div><div class="row between"><div class="row"><span class="preference-icon">↻</span><div><label class="pref-title" for="auto-site">在此网站自动翻译</label><div class="pref-sub" id="site-name">仅对当前网站生效</div></div></div><label class="switch"><input type="checkbox" id="auto-site" aria-label="在此网站自动翻译"><span></span></label></div></section>
  <section class="action-area"><button id="translate" class="primary translate"><span id="translate-label">开始翻译此页</span><span aria-hidden="true">↗</span></button><div class="row between under-action"><span id="status" role="status">只翻译视野附近的内容</span><button id="restore" class="text-button">还原网页</button></div><div id="feedback" class="message hidden" role="status"></div></section>
  <footer class="row between"><span><span class="cursor-icon">⌁</span> 选中词语，右键即可智能解释</span><span class="keyboard" title="开始或暂停翻译">Alt ⇧ L</span></footer>
</main><script type="module" src="popup.js"></script></body></html>
